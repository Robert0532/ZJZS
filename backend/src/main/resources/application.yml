server:
  port: 8088
  servlet:
    context-path: /api

spring:
  application:
    name: rbac-skeleton
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/rbac_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&zeroDateTimeBehavior=convertToNull&rewriteBatchedStatements=true
    username: root
    password: "123456"
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1200000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: rbac-skeleton-jwt-secret-key-please-change-in-production-2026
    expire-hours: 12
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

logging:
  level:
    com.example.rbac: debug
